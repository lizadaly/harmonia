name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Build
      run: |
        npm ci
        npm run build

    - name: Install browser
      run: npx playwright install --with-deps chromium

    - name: Test
      run: npm test
